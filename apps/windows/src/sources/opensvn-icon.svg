<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="ov-title ov-desc">
<title id="ov-title">OpenSVN application icon</title><desc id="ov-desc">An open blue project folder containing layered project documents. A white and cyan revision graph is integrated into its front panel.</desc>
<defs>
<linearGradient id="ov-back" x1="90" y1="125" x2="430" y2="400" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
<stop offset="0" stop-color="#1D77E8"/><stop offset=".32" stop-color="#1766D7"/><stop offset=".68" stop-color="#1455BF"/><stop offset="1" stop-color="#103F9D"/>
</linearGradient>
<linearGradient id="ov-paper" x1="220" y1="90" x2="365" y2="300" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
<stop offset="0" stop-color="#FFFFFF"/><stop offset=".32" stop-color="#F6FBFF"/><stop offset=".72" stop-color="#E6F2FF"/><stop offset="1" stop-color="#CEE3FF"/>
</linearGradient>
<linearGradient id="ov-face" x1="130" y1="218" x2="385" y2="432" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
<stop offset="0" stop-color="#47A8FF"/><stop offset=".28" stop-color="#2D8FF4"/><stop offset=".65" stop-color="#1B70E5"/><stop offset="1" stop-color="#1554C4"/>
</linearGradient>
<linearGradient id="ov-fold" x1="330" y1="90" x2="360" y2="130" gradientUnits="userSpaceOnUse" color-interpolation="linearRGB">
<stop offset="0" stop-color="#C0DDFF"/><stop offset=".3" stop-color="#B3D6FE"/><stop offset=".7" stop-color="#A6CEFC"/><stop offset="1" stop-color="#98C5F7"/>
</linearGradient>
<filter id="ov-ground" x="-.25" y="-1" width="1.5" height="3" color-interpolation-filters="linearRGB"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="ov-sheet-shadow" x="-.3" y="-.2" width="1.6" height="1.5" color-interpolation-filters="linearRGB">
<feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#174999" flood-opacity=".2"/>
</filter>
<filter id="ov-face-shadow" x="-.2" y="-.2" width="1.4" height="1.5" color-interpolation-filters="linearRGB">
<feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#174999" flood-opacity=".15"/>
</filter>
</defs>
