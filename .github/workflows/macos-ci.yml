name: macOS CI

# R8: `main` must always be buildable. This workflow is the gate that enforces it
# for the macOS half of the tree. The Windows half is `.github/workflows/windows-ci.yml`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Actual CI toolchain — recorded from the runner; this file is the record.
  # This is the *strictest* compiler the code must satisfy: Swift 6.2 changed the
  # default actor isolation of nonisolated async functions (SE-0461), so newer
  # local toolchains accept code that 6.1 rejects. Never assume a green local
  # build means a green CI build for concurrency changes.
  EXPECTED_SWIFT: "6.1"
  EXPECTED_MACOS: "15"

jobs:
  package:
    name: Swift package (build + tests)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          # A major-version-only check would silently accept any future Swift, which
          # is exactly how the 6.4-vs-6.1 divergence went unnoticed. Match major.minor
          # and update this file plus toolchain.md in the same PR when the runner moves.
          if ! swift --version | grep -q "Swift version ${EXPECTED_SWIFT}\."; then
            echo "::warning::runner Swift is not the pinned ${EXPECTED_SWIFT} baseline — update EXPECTED_SWIFT here if this is intentional"
          fi
          if [[ "$(sw_vers -productVersion)" != ${EXPECTED_MACOS}.* ]]; then
            echo "::warning::runner macOS is not the pinned ${EXPECTED_MACOS} baseline"
          fi

      - name: Ensure Subversion CLI
        run: |
          # These jobs need more than `svn`: the bundle embeds svnadmin, so a guard
          # that only tests for `svn` skips the install on an image that ships
          # Apple's CLI without svnadmin — and then fails on the next line for a
          # reason that looks like a broken runner rather than a missing tool.
          missing=""
          for tool in svn svnadmin; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [[ -n "$missing" ]]; then
            echo "missing:$missing — installing Subversion via Homebrew"
            brew install subversion
          fi
          svn --version --quiet
          svnadmin --version --quiet

      # --layout (planned tree), --metadata (VERSION/CHANGELOG/Info.plist) and
      # --fixtures (recorded svn output) all run by default.
      - name: Validate repository
        run: python3 scripts/verify-release.py

      - name: Build
        working-directory: apps/macos
        run: swift build --build-tests

      - name: Test
        working-directory: apps/macos
        run: swift test

  app-bundle:
    name: App bundle (SwiftPM assembly)
    runs-on: macos-15
    timeout-minutes: 30
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble build/OpenSVN.app
        run: scripts/build-macos-app.sh

      - name: Verify bundle
        run: python3 scripts/verify-release.py --bundle build/OpenSVN.app

      # The signing path cannot be exercised without a Developer ID, but its
      # refusal paths can: a script that silently succeeds without credentials is
      # how an unsigned build ends up in a release.
      - name: Signing inputs are valid
        run: |
          plutil -lint packaging/macos/entitlements.plist
          bash -n scripts/sign-macos-app.sh packaging/macos/notarize.sh

      - name: Signing refuses to run without an identity
        run: |
          if env -u SIGN_IDENTITY scripts/sign-macos-app.sh build/OpenSVN.app; then
            echo "::error::sign-macos-app.sh succeeded without SIGN_IDENTITY"
            exit 1
          fi

      - name: Notarisation refuses a non-notarisable signature
        run: |
          if packaging/macos/notarize.sh build/OpenSVN.app; then
            echo "::error::notarize.sh accepted an ad-hoc signature"
            exit 1
          fi

      - name: An unsigned bundle fails the release gate
        run: |
          if python3 scripts/verify-release.py --bundle build/OpenSVN.app --require-signed; then
            echo "::error::--require-signed accepted an ad-hoc bundle"
            exit 1
          fi

  # S6-1 + S6-6. The previous job proves the shell of the app assembles; this one
  # proves the thing we actually ship can run on a Mac that has never seen
  # Subversion. Those are different claims, and only the second one satisfies the
  # rule in §2 of the specification.
  #
  # It runs on every PR on purpose: a forgotten dylib or a Homebrew path left in a
  # binary is invisible on a developer machine and impossible to notice at release
  # time without this job.
  runtime:
    name: Bundled runtime + clean-machine check (S6-1, S6-6)
    runs-on: macos-15
    timeout-minutes: 40
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Subversion CLI
        run: |
          if ! command -v svn >/dev/null 2>&1; then
            echo "svn not preinstalled on this image; installing via Homebrew"
            brew install subversion
          fi
          # Both tools are embedded in the app, so both must exist to build it.
          svn --version --quiet
          svnadmin --version --quiet

      - name: Assemble with the embedded runtime
        run: CONFIG=release BUNDLE_SVN=1 scripts/build-macos-app.sh

      - name: Verify bundle and runtime manifest
        run: |
          python3 scripts/verify-release.py \
            --bundle build/OpenSVN.app \
            --require-bundled-svn

      - name: Clean-machine check
        run: scripts/verify-clean-install.sh

      - name: Upload clean-machine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-install-report
          path: build/clean-install-report.txt
          if-no-files-found: ignore
          retention-days: 14

  xcode-project:
    name: Xcode project (signing disabled)
    runs-on: macos-15
    timeout-minutes: 40
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: xcodebuild
        run: |
          xcodebuild \
            -project apps/macos/OpenSVN.xcodeproj \
            -scheme OpenSVN \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  # S5-5: fault injection. Separate from `package` on purpose — these drive real
  # svn processes, a real svnserve on loopback and a proxy that severs the link
  # mid-transfer, so a failure here means the product misbehaves in the world,
  # not that a unit test disagrees with itself.
  scenarios:
    name: Fault-injection scenarios (S5-5)
    runs-on: macos-15
    timeout-minutes: 20
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Subversion CLI
        run: |
          # These jobs need more than `svn`: the bundle embeds svnadmin, so a guard
          # that only tests for `svn` skips the install on an image that ships
          # Apple's CLI without svnadmin — and then fails on the next line for a
          # reason that looks like a broken runner rather than a missing tool.
          missing=""
          for tool in svn svnadmin svnserve; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [[ -n "$missing" ]]; then
            echo "missing:$missing — installing Subversion via Homebrew"
            brew install subversion
          fi
          svn --version --quiet
          svnadmin --version --quiet
          svnserve --version --quiet

      # The scenarios assert on the app's own classification, which lives in
      # OpenSVNCore; a shell script cannot reach it without this probe.
      - name: Build the error probe
        working-directory: apps/macos
        run: swift build --product opensvn-probe

      - name: Run scenarios
        run: tests/scenarios/run.sh

      - name: Upload scenario logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-logs
          path: tests/.work/scenarios/**/*.log
          if-no-files-found: ignore
          retention-days: 7
