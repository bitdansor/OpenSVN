name: CodeQL

# Swift is analysed today. C++ joins the matrix in the PR that makes the Windows
# build green (CodeQL needs a compilable project; apps/windows is an empty
# placeholder as of 2026-10-18).
#
# Code scanning is only available on private repositories with a GitHub Advanced
# Security licence. This repository is private and has none, so the first run
# (39106470737) spent 12 minutes building and then failed in Analyze with
# "Code scanning is not enabled for this repository". Skipping on private repos
# keeps the state honest — the job shows as skipped, never as a passing scan.
# The project is Apache-2.0 and will be opened; scanning then starts with no edit.
# To run it while private, enable code scanning and remove the `if:` line.

on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/macos/**"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build
        working-directory: apps/macos
        run: swift build

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
