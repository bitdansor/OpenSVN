name: CodeQL

# Swift is analysed today. The Windows C++ core and C# UI are not in the matrix
# yet: C++ CodeQL needs a Windows job that configures and compiles the CMake
# project, and C# needs a restore/build step. Add those once windows-ci.yml has a
# green baseline; until then this workflow deliberately does not claim coverage
# of apps/windows.
#
# Code scanning is free on public repositories and needs a GitHub Advanced
# Security licence on private ones. This repository is public and scanning is
# enabled: each run uploads an analysis under the `swift` category, and the
# current tree analyses to 0 results across 28 rules. The `if:` guard is kept
# for the reverse case — if the repository ever goes private without a licence,
# the job is skipped instead of spending twelve minutes building and then failing
# in Analyze with "Code scanning is not enabled for this repository", which is
# what the first run (39106470737) did.
#
# A red run does not always mean a finding. On 2026-11-02 the scheduled job sat
# in the macOS queue with no runner assigned and was cancelled after fifteen
# minutes, which renders as a failed run with zero steps; on 2026-11-06 the
# build step failed on the pinned Swift 6.1 compiler. Neither was a CodeQL
# result. Read the step that failed before reading the annotations.

on:
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/macos/**"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language: [swift]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build
        working-directory: apps/macos
        run: swift build

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
