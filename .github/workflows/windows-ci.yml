name: Windows CI

# This workflow is the gate the Windows port must eventually pass. Right now the
# C++ has never been compiled, so both jobs are non-blocking on purpose: a
# workflow that is red from day one teaches people to ignore CI. Remove every
# `continue-on-error` line in the PR that makes the build green — that PR is the
# real "Windows exists" milestone. Until then the job still shows red in the
# Actions tab (so the gap stays visible) while the run itself stays green.

on:
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "tests/fixtures/**"
      - "scripts/bootstrap-windows.ps1"
      - ".github/workflows/windows-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "tests/fixtures/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned SDK baseline, see docs/development/toolchain.md.
  WINDOWS_SDK: "10.0.26100.0"

jobs:
  build:
    name: Build + tests (x64)
    runs-on: windows-2022
    timeout-minutes: 45
    # Non-blocking until the port compiles; see the header comment.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report toolchain
        # Informational only. An earlier version hardcoded vswhere under
        # %ProgramFiles%, but the windows-2022 image keeps the Visual Studio
        # Installer under %ProgramFiles(x86)%, so the step failed with
        # "The term ... vswhere.exe is not recognized" before any build ran.
        continue-on-error: true
        shell: pwsh
        run: |
          [System.Environment]::OSVersion.VersionString
          Write-Host "architecture: $env:PROCESSOR_ARCHITECTURE"

          $candidates = @()
          $cmd = Get-Command vswhere.exe -ErrorAction SilentlyContinue
          if ($cmd) { $candidates += $cmd.Source }
          $candidates += "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $candidates += "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"

          $found = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $found) {
            Write-Host "::warning::vswhere.exe not found; Visual Studio version unknown"
            exit 0
          }

          Write-Host "vswhere: $found"
          & $found -latest -property displayName
          & $found -latest -property installationVersion
          $msbuild = & $found -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe"
          Write-Host "msbuild: $msbuild"

      - name: Check svn CLI
        run: |
          # svn.exe ships with the GitHub runner image; if that changes, install it.
          if (-not (Get-Command svn.exe -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::svn.exe not on PATH, contract tests against a real repository will be skipped"
          } else {
            svn --version --quiet
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        continue-on-error: true
        run: msbuild apps/windows/OpenSVN.sln /t:Restore /p:Configuration=Debug /p:Platform=x64

      - name: Build app
        continue-on-error: true
        run: msbuild apps/windows/OpenSVN.sln /p:Configuration=Debug /p:Platform=x64 /m /verbosity:minimal

      - name: Run contract tests
        continue-on-error: true
        run: |
          $test = Get-ChildItem -Recurse -Filter OpenSVNTests.exe | Select-Object -First 1
          if (-not $test) { Write-Error "OpenSVNTests.exe not produced"; exit 1 }
          & $test.FullName --gtest_output=xml:test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: test-results.xml
          if-no-files-found: ignore

  # Parser parity is the reason the Windows job exists at all: the same fixture
  # must produce the same fields. Enabled once the parser compiles.
  parity:
    name: Fixture parity (blocked until parser compiles)
    runs-on: windows-2022
    needs: build
    if: false
    steps:
      - run: echo "Compare OpenSVN Windows JSON output with the macOS baseline."
