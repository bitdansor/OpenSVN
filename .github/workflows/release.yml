name: Release

# Stage 6: tag v* -> build -> (sign + notarise, when credentials exist) ->
# package -> sign the digest list -> publish.
#
# Two ways for an artifact to be verifiable, and a release needs one of them:
#
#   1. Developer ID + notarisation. Needs MACOS_CERTIFICATE_P12 /
#      MACOS_SIGN_IDENTITY / NOTARY_*, i.e. a paid Apple Developer account.
#   2. A digest list signed by this project's Ed25519 key. Needs only
#      UPDATE_SIGNING_KEY, which is generated locally for free with
#      `swift scripts/update-signing-key.swift generate`. The app carries the
#      matching public key, so it can verify an update without Apple in the loop.
#
# With neither, a tag build still produces an artifact — it just refuses at the
# `Require a verifiable artifact` step, because publishing bytes nothing can
# check would make the updater's verification a decoration.
#
# Still outstanding before this can be described as a finished release process:
# Windows artifacts (S6-3), the two-platform cross-regression (S7-1), the
# compliance audit (S7-2), release notes (S7-4) and a trademark re-check (S7-5).
# The publish job prints them as a warning rather than refusing, because the
# decision to publish belongs to the maintainer and no CI step can make it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  version:
    name: Check VERSION matches the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Compare with tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="${{ steps.read.outputs.version }}"
          # A tag must be the release version, never a -dev one.
          case "$version" in *-dev*) echo "::error::VERSION is '$version', refusing to release a dev build"; exit 1;; esac
          case "$tag" in "$version"|"$version"-*) ;; *) echo "::error::tag v$tag does not match VERSION $version"; exit 1;; esac

  macos:
    name: macOS bundle (signed + notarised when credentials exist)
    runs-on: macos-15
    needs: version
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Subversion CLI
        run: |
          # svnadmin is embedded in the bundle too, and an image can ship Apple's
          # svn without it; test for both before deciding to skip the install.
          missing=""
          for tool in svn svnadmin; do
            command -v "$tool" >/dev/null 2>&1 || missing="$missing $tool"
          done
          if [[ -n "$missing" ]]; then
            echo "missing:$missing — installing Subversion via Homebrew"
            brew install subversion
          fi
          svn --version --quiet
          svnadmin --version --quiet

      # Credentials are optional for a dry run and mandatory for a real tag.
      # Deciding that in one shell step keeps the `if:` conditions below readable
      # and, more importantly, keeps the failure message at the end of the job
      # instead of a silently unsigned artifact.
      - name: Detect signing credentials
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_ID: ${{ secrets.NOTARY_APPLE_ID }}
          UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [[ -n "$CERT" && -n "$IDENTITY" ]]; then
            echo "SIGNING_AVAILABLE=1" >> "$GITHUB_ENV"
            echo "signing identity: $IDENTITY"
          else
            echo "SIGNING_AVAILABLE=0" >> "$GITHUB_ENV"
            echo "::warning::no Developer ID credentials; this run produces an ad-hoc build"
          fi
          if [[ -n "$NOTARY_ID" ]]; then
            echo "NOTARY_AVAILABLE=1" >> "$GITHUB_ENV"
          else
            echo "NOTARY_AVAILABLE=0" >> "$GITHUB_ENV"
          fi
          if [[ -n "$UPDATE_KEY" ]]; then
            echo "MANIFEST_SIGNING=1" >> "$GITHUB_ENV"
          else
            echo "MANIFEST_SIGNING=0" >> "$GITHUB_ENV"
            echo "::warning::no UPDATE_SIGNING_KEY; the digest list cannot be signed and the updater will refuse this release"
          fi

      - name: Import signing certificate
        if: env.SIGNING_AVAILABLE == '1'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/opensvn-signing.keychain-db"
          echo -n "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt that never appears.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [[ "${SIGNING_AVAILABLE}" == "1" ]]; then
            SIGN_IDENTITY="$IDENTITY" CONFIG=release BUNDLE_SVN=1 scripts/build-macos-app.sh
          else
            CONFIG=release BUNDLE_SVN=1 scripts/build-macos-app.sh
          fi

      - name: Verify bundle
        run: |
          ARGS=(--bundle build/OpenSVN.app --require-bundled-svn)
          if [[ "${SIGNING_AVAILABLE}" == "1" ]]; then
            ARGS+=(--require-signed)
          fi
          python3 scripts/verify-release.py "${ARGS[@]}"

      # The release must not be the first time anyone asks whether the embedded
      # runtime works without a system Subversion (S6-6).
      - name: Clean-machine check
        run: scripts/verify-clean-install.sh

      - name: Notarise and staple
        if: env.SIGNING_AVAILABLE == '1' && env.NOTARY_AVAILABLE == '1'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_SUMMARY: build/notarization.json
        run: packaging/macos/notarize.sh build/OpenSVN.app

      - name: Re-verify the stapled bundle
        if: env.SIGNING_AVAILABLE == '1' && env.NOTARY_AVAILABLE == '1'
        run: |
          python3 scripts/verify-release.py \
            --bundle build/OpenSVN.app \
            --require-bundled-svn --require-signed --require-notarized

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # One name for every release. Whether Apple signed it is recorded in the
          # release notes and the digest list, not hidden in the file name: the
          # updater cares about the signature, and a reader who wants to know can
          # run `codesign -dv`.
          NAME="OpenSVN-${VERSION}-macos-arm64.zip"
          ditto -c -k --keepParent build/OpenSVN.app "$NAME"
          shasum -a 256 "$NAME" > SHA256SUMS

          if [[ "${MANIFEST_SIGNING}" == "1" ]]; then
            # The private key exists only for the length of these two commands.
            # Writing it to a file rather than passing it as an argument keeps it
            # out of the process list.
            umask 077
            KEY_FILE="$RUNNER_TEMP/update-signing-key"
            printf '%s\n' "$UPDATE_KEY" > "$KEY_FILE"
            swift scripts/update-signing-key.swift sign SHA256SUMS --key "$KEY_FILE"
            # Signing is not the end of it: verify with the same key the app
            # carries, so a malformed key fails here rather than on a user's Mac.
            swift scripts/update-signing-key.swift verify SHA256SUMS --key "$KEY_FILE"
            rm -f "$KEY_FILE"
            echo "SHA256SUMS.sig written" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::SHA256SUMS is not signed; the app will offer this release as a manual download only" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "ARTIFACT=$NAME" >> "$GITHUB_ENV"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            OpenSVN-*-macos-*.zip
            SHA256SUMS
            SHA256SUMS.sig
            build/notarization.json
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: clean-install-report
          path: build/clean-install-report.txt
          if-no-files-found: ignore
          retention-days: 90

      # A tag build that nothing can verify is a configuration mistake, and the
      # right place to say so is here — not in the publish job, after the
      # artifact has already been uploaded.
      - name: Require a verifiable artifact for a tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "${SIGNING_AVAILABLE}" == "1" && "${NOTARY_AVAILABLE}" == "1" ]]; then
            echo "Developer ID signed and notarised."
            exit 0
          fi
          if [[ "${MANIFEST_SIGNING}" == "1" && -f SHA256SUMS.sig ]]; then
            echo "Not notarised, but the digest list is signed with the project key."
            exit 0
          fi
          echo "::error::tag build is neither notarised nor covered by a signed digest list; no updater could verify it"
          exit 1

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, macos]
    if: startsWith(github.ref, 'refs/tags/v') && (inputs.dry_run == false || inputs.dry_run == null)
    steps:
      - uses: actions/download-artifact@v4
      - name: Check the artifact set
        run: |
          set -euo pipefail
          if ! compgen -G "macos/OpenSVN-*-macos-*.zip" >/dev/null; then
            echo "::error::no macOS artifact found"
            exit 1
          fi
          # The updater refuses an update whose digest list is not signed, so
          # publishing one would ship a release that can only be downloaded by
          # hand. That is a legitimate state, but it is not this job's default —
          # it has to be chosen deliberately by omitting the key.
          if [[ ! -f macos/SHA256SUMS || ! -f macos/SHA256SUMS.sig ]]; then
            echo "::error::artifact is not covered by a signed digest list (need SHA256SUMS + SHA256SUMS.sig)"
            exit 1
          fi
          ls -l macos/
          {
            echo "### Outstanding release gates"
            echo ""
            echo "Publishing was allowed because the artifact is verifiable. These"
            echo "are still open and are not checked by this workflow:"
            echo ""
            echo "- S6-3 Windows artifacts"
            echo "- S7-1 two-platform cross-regression"
            echo "- S7-2 compliance audit"
            echo "- S7-4 release notes beyond the generated changelog"
            echo "- S7-5 trademark re-check"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::publishing without S6-3 / S7-1 / S7-2 / S7-4 / S7-5 being signed off"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            macos/OpenSVN-*-macos-*.zip macos/SHA256SUMS macos/SHA256SUMS.sig \
            --title "OpenSVN ${TAG#v}" \
            --generate-notes \
            --verify-tag
